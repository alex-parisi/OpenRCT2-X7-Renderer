name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_VERSION: "22"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --only-group dev --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --only-group dev --no-install-project
          uv pip install "numpy>=1.26" "pillow>=10.0" "pyyaml>=6.0"

      - name: mypy
        run: uv run --no-sync mypy

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION}
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-${LLVM_VERSION} 100

      - name: clang-format --dry-run --Werror
        run: |
          clang-format --version
          clang-format --dry-run --Werror \
            x7_renderer/bindings.cpp \
            x7_renderer/src/*.hpp x7_renderer/src/*.cpp \
            x7_renderer/tests/*.cpp

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    env:
      EMBREE_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy + build tooling
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION} \
            cmake ninja-build

      - uses: ./.github/actions/install-embree-linux
        with:
          version: ${{ env.EMBREE_VERSION }}

      - name: Configure CMake (compile DB)
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: |
          cmake -S x7_renderer -B x7_renderer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_MODULE=OFF

      - name: clang-tidy
        run: |
          clang-tidy-${LLVM_VERSION} --version
          clang-tidy-${LLVM_VERSION} -p x7_renderer/build --warnings-as-errors='*' \
            x7_renderer/src/Mesh.cpp \
            x7_renderer/src/Palette.cpp \
            x7_renderer/src/RayTrace.cpp \
            x7_renderer/src/Renderer.cpp
