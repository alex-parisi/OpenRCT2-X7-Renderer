name: publish

# Build the Embree-vendored wheels (cp311 + cp313 per platform) + an sdist,
# then publish to PyPI. Triggered by a pushed `v*` tag (or manually, which
# builds 0.0.0 and skips the upload). PyPI upload uses Trusted Publishing
# (OIDC) -- configure this repo + workflow as a trusted publisher on PyPI, no
# API token needed.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  EMBREE_VERSION: "4.4.1"

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-14
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    steps:
      - uses: actions/checkout@v4

      # Pin the project version from the tag (or 0.0.0 for manual runs) so the
      # built wheels carry the release version.
      - name: Pin version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          python scripts/ci/set_version.py "$VERSION"

      # Linux Embree is fetched inside the manylinux container by
      # scripts/ci/install_embree_linux.sh (wired via [tool.cibuildwheel.linux]
      # before-all). macOS/Windows build on the host, so fetch Embree here and
      # export the paths cibuildwheel forwards into the build.
      - name: Install Embree (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EMB="$GITHUB_WORKSPACE/embree"
          BASE="https://github.com/RenderKit/embree/releases/download"
          curl -fL -o embree.zip "$BASE/v$EMBREE_VERSION/embree-$EMBREE_VERSION.arm64.macosx.zip"
          mkdir -p "$EMB"
          unzip -q embree.zip -d "$EMB"
          inner=$(find "$EMB" -maxdepth 1 -mindepth 1 -type d -name 'embree*' | head -n1)
          [ -n "$inner" ] && cp -R "$inner"/* "$EMB/" || true
          echo "EMBREE_ROOT=$EMB" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$EMB" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$EMB/lib" >> "$GITHUB_ENV"

      - name: Install Embree (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EMB="$GITHUB_WORKSPACE/embree"
          BASE="https://github.com/RenderKit/embree/releases/download"
          curl -fL -o embree.zip "$BASE/v$EMBREE_VERSION/embree-$EMBREE_VERSION.x64.windows.zip"
          mkdir -p "$EMB"
          unzip -q embree.zip -d "$EMB"
          inner=$(find "$EMB" -maxdepth 1 -mindepth 1 -type d -name 'embree*' | head -n1)
          [ -n "$inner" ] && cp -R "$inner"/* "$EMB/" || true
          echo "EMBREE_ROOT=$GITHUB_WORKSPACE\\embree" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE\\embree" >> "$GITHUB_ENV"

      - name: Configure cibuildwheel env passthrough (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "CIBW_ENVIRONMENT_PASS_LINUX=EMBREE_VERSION" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          python scripts/ci/set_version.py "$VERSION"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish-to-pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Only publish for real release tags, never for manual 0.0.0 runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
