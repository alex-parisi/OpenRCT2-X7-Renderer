[project]
name = "openrct2-x7-renderer"
version = "0.1.0"
description = "Embree-backed isometric renderer that turns meshes into OpenRCT2 palette-indexed sprites."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Alex Parisi", email = "alex@atparisi.com" }
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/alex-parisi/OpenRCT2-X7-Renderer"
Repository = "https://github.com/alex-parisi/OpenRCT2-X7-Renderer"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=openrct2_x7_renderer"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["openrct2_x7_renderer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N"]

[tool.mypy]
python_version = "3.11"
files = ["openrct2_x7_renderer"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[build-system]
# pybind11>=3.0 is required to build the cp314 extension (2.x tops out at 3.13).
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "x7_renderer"
cmake.version = ">=3.25"
wheel.packages = ["openrct2_x7_renderer"]
build-dir = "build/{wheel_tag}"

# Embree-vendored wheels for distribution on PyPI.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
build-frontend = "build"
skip = ["*-musllinux*", "*_i686", "*-win32"]

# Sanity check: the extension imports and Embree resolves from vendored libs.
test-command = "python -c \"import openrct2_x7_renderer._x7_renderer as n; print('embree ok', n.LIGHT_DIFFUSE)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "bash {project}/scripts/ci/install_embree_linux.sh"
environment = { EMBREE_ROOT = "/embree", CMAKE_PREFIX_PATH = "/embree", LD_LIBRARY_PATH = "/embree/lib64" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path %EMBREE_ROOT%\\bin -w {dest_dir} {wheel}"
